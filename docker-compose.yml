services:


  mysql:
    image: mysql:latest
    container_name: shop-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 2s
      retries: 5


  app:
    build: .
    image: docker-demo
    ports:
      - "9090:8080"
    environment:
      SERVER_PORT: 8080

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - name-vol:/app/data

volumes:
  name-vol:
  mysql_data: